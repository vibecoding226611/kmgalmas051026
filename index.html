s2h:"Покупка вторичного жилья",s2p:"Проверяю юридическую чистоту и реальную рыночную цену. Помогаю торговаться.",

w_h:"Почему Астана",w_p:"Астана — столица с растущим населением, активной застройкой и деловой средой. Для инвестора это рынок, где недвижимость остаётся востребованной.",

w3h:"Выбор",w3p:"От комфорт-класса до премиум: можно подобрать объект под любой бюджет и цель.",

a2:"Мои клиенты — предприниматели, специалисты из других городов, казахстанцы за рубежом и иностранные инвесторы. Многие покупают удалённо.",

r1:"«Живу в Алматы, квартиру в Астане купил, ни разу не приехав до сделки. Диас показал объект по видеосвязи и нашёл у застройщика проблему с документами, о которой я не знал.»",rn1:"Ерлан С.",rw1:"Предприниматель, Алматы · 2-комнатная квартира в новостройке",

s_h:"Қызметтер",s_p:"Идеядан жұмыс істейтін активке дейін көмектесемін: нысанды таңдаймын, тексеремін, мәмілені рәсімдеймін және қажет болса жалға беруді ұйымдастырамын.",
s1h:"Жаңа үйлерді таңдау",s1p:"Құрылысшылар мен жобаларды талдаймын. Тәуекелі аз нұсқаларды ғана көрсетемін.",
s2h:"Қайталама тұрғын үй сатып алу",s2p:"Заңдық тазалығын және нақты нарықтық бағасын тексеремін. Саудаласуға көмектесемін.",
s3h:"Жалға беру және басқару",s3p:"Жалға алушыларды табамын және үдерісті жолға қоямын. Артық әуреге түспей табыс аласыз.",
s4h:"Инвестициялық кеңес",s4p:"Мақсатыңыз бен бюджетіңізді талдаймыз. Капиталды сақтау стратегиясын құрамыз.",
s5h:"Мәмілені сүйемелдеу",s5p:"Құжаттар мен есеп айырысуды өз мойныма аламын. Мәміле қауіпсіз, қашықтан да өтеді.",
w_h:"Неге Астана",w_p:"Астана — халқы өсіп келе жатқан, құрылысы белсенді, іскерлік ортасы дамыған елорда. Инвестор үшін бұл жылжымайтын мүлік сұранысқа ие нарық.",
w1h:"Инфляциядан қорғау",w1p:"Жылжымайтын мүлік дәстүрлі түрде капиталдың сатып алу қабілетін сақтайды.",
w2h:"Өтімділік",w2p:"Тұрақты сұраныс активтен ақылға қонымды мерзімде шығуға мүмкіндік береді.",
w3h:"Таңдау",w3p:"Комфорт-сыныптан премиумға дейін: кез келген бюджет пен мақсатқа нысан табуға болады.",
w_end:"Менің міндетім — осы алуан түрліден капиталыңызға нақты жұмыс істейтінін таңдау.",

h4h:"Қарау",h4p:"Нысандарды жеке немесе басқа қаладағылар үшін онлайн көрсетемін.",
h5h:"Тексеру және мәміле",h5p:"Құжаттар мен құрылысшыны тексеремін, рәсімдеуді сүйемелдеймін.",

a1:"Диас Әлиев — Астанадағы жеке риэлтор. 8 жыл инвесторлармен жұмыс істеймін, тұрғын үйді жай пәтер емес, актив ретінде таңдауға көмектесемін.",

a3:"Мен тәуелсіз жұмыс істеймін және құрылысшының емес, сатып алушының мүддесін қорғаймын.",

r_h:"Клиенттер пікірлері",r1:"«Алматыда тұрамын, Астанадағы пәтерді мәмілеге дейін бірде-бір рет келмей сатып алдым. Диас нысанды бейнебайланыс арқылы көрсетіп, құрылысшының құжаттарындағы мен білмеген мәселені тапты.»",rn1:"Ерлан С.",rw1:"Кәсіпкер, Алматы · жаңа үйдегі 2 бөлмелі пәтер",r2:"«Бос ақшаны салып, жалға беру керек болды. Бизнес-орталықтарға жақын пәтер таңдадық, екінші жылы бос тұрмай жалға беріліп келеді.»",rn2:"Айгерім Т.",rw2:"Дәрігер, Шымкент · жалға берілетін студия",r3:"«Германияда тұрамын. Бәрінің ашық болғаны ұнады: есептер, мәміле бойынша есептемелер, жалға алушыларды табу.»",rn3:"Марат К.",rw3:"IT маманы, Берлин · қайталама 1 бөлмелі пәтер",

let lang="ru";
function setLang(l){
  lang=T[l]?l:"ru";const t=T[lang];
  try{localStorage.setItem("lang",lang)}catch(e){}
  document.documentElement.lang=lang==="kz"?"kk":lang;
  document.title=t.title;
  document.querySelector('meta[name=description]').content=t.desc;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=t[el.dataset.i]});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.getElementById("faqlist").innerHTML=t.faq.map(([q,a],i)=>`<details${i===0?" open":""}><summary>${q}</summary><p>${a}</p></details>`).join("");
  document.getElementById("faq-ld").textContent=JSON.stringify({"@context":"https://schema.org","@type":"FAQPage","mainEntity":t.faq.map(([q,a])=>({"@type":"Question","name":q,"acceptedAnswer":{"@type":"Answer","text":a}}))});
  document.querySelectorAll(".f.bad").forEach(f=>f.classList.remove("bad"));
  if(window.buildCat)buildCat();
}

/* phone mask +7 */
const ph=document.getElementById("phone");
ph.addEventListener("input",()=>{
  let d=ph.value.replace(/\D/g,"");
  if(d[0]==="7"||d[0]==="8")d=d.slice(1);
  d=d.slice(0,10);
  let s="+7";
  if(d.length)s+=" ("+d.slice(0,3);
  if(d.length>=3)s+=") "+d.slice(3,6);
  if(d.length>=6)s+="-"+d.slice(6,8);
  if(d.length>=8)s+="-"+d.slice(8,10);
  ph.value=s;
});

/* form */
const form=document.getElementById("lead");
function bad(el,cond){el.closest(".f").classList.toggle("bad",cond);return cond}
form.addEventListener("submit",e=>{
  e.preventDefault();
  if(form.website.value)return; // honeypot
  const errs=[
    bad(form.name,!form.name.value.trim()),
    bad(form.phone,form.phone.value.replace(/\D/g,"").length!==11),
    bad(form.contact,!form.contact.value),
    bad(document.getElementById("agree"),!document.getElementById("agree").checked)
  ];
  if(errs.some(Boolean)){form.querySelector(".bad input,.bad select")?.focus();return}
  const data=Object.fromEntries(new FormData(form));delete data.website;data.obj=(window.OBJ||"");
  // TODO: отправить заявку риэлтору ([Telegram / email / CRM]), напр. fetch("/api/lead",{method:"POST",body:JSON.stringify(data)})
  console.log("lead",data);
  if(window.gtag)gtag("event","generate_lead");
  form.style.display="none";document.getElementById("thanks").style.display="block";
});
document.querySelectorAll("[data-track]").forEach(a=>a.addEventListener("click",()=>{if(window.gtag)gtag("event","click_"+a.dataset.track)}));

let CAT=null;
const PHONE="77015550123";
function fmtPrice(p,u){return CAT==="rent"?p.toLocaleString("ru-RU")+" "+u.perm:p.toLocaleString("ru-RU",{maximumFractionDigits:1})+" "+u.mln}
function roomsLabel(r,u){return r===0?u.studio:r+" "+u.room}
function priceSteps(){return CAT==="rent"?[200000,300000,400000]:[30,45,60,100]}

function buildCat(){
  if(!CAT)return;
  const u=CU[lang];
  document.title=u["title_"+CAT]+" — "+u.brand;
  const tabs=["new","resale","rent"].map(k=>`<a href="#/${k}"${k===CAT?' class="on"':""}>${u["cat_"+k]}</a>`).join("");
  document.getElementById("catview").innerHTML=`
  <div class="pagehead"><div class="wrap"><h1>${u["title_"+CAT]}</h1><p>${u["lead_"+CAT]}</p><div class="tabs">${tabs}</div></div></div>
  <section><div class="wrap">
    <div class="filters">
      <div class="f"><label for="fd">${u.f_district}</label><select id="fd"><option value="">${u.any}</option>${Object.entries(u.dist).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
      <div class="f"><label for="fr">${u.f_rooms}</label><select id="fr"><option value="">${u.any}</option><option value="0">${u.studio}</option>${[1,2,3,4].map(n=>`<option value="${n}">${n}${n===4?"+":""}</option>`).join("")}</select></div>
      <div class="f"><label for="fp">${u.f_price}</label><select id="fp"><option value="">${u.any_p}</option>${priceSteps().map(s=>`<option value="${s}">${s.toLocaleString("ru-RU")} ${CAT==="rent"?u.perm:u.mln}</option>`).join("")}</select></div>
      <div class="f"><label for="fs">${u.f_sort}</label><select id="fs"><option value="">${u.s_def}</option><option value="asc">${u.s_asc}</option><option value="desc">${u.s_desc}</option><option value="area">${u.s_area}</option></select></div>
    </div>
    <p class="count" id="count" role="status"></p>
    <div class="grid" id="list"></div>
    <p class="note">${u.note}</p>
    <div class="cta-band"><h2>${u.band_h}</h2><p>${u.band_p}</p><a class="btn primary" href="#/contacts">${u.band_b}</a></div>
  </div></section>`;
  ["fd","fr","fp","fs"].forEach(id=>document.getElementById(id).onchange=renderCat);
  renderCat();
}

function renderCat(){
  const u=CU[lang],v=id=>document.getElementById(id).value;
  let items=DATA[CAT].filter(o=>(!v("fd")||o.d===v("fd"))&&(!v("fr")||(v("fr")==="4"?o.r>=4:o.r===+v("fr")))&&(!v("fp")||o.p<=+v("fp")));
  const s=v("fs");
  if(s==="asc")items.sort((a,b)=>a.p-b.p);else if(s==="desc")items.sort((a,b)=>b.p-a.p);else if(s==="area")items.sort((a,b)=>b.a-a.a);
  document.getElementById("count").textContent=u.found+" "+items.length;
  document.getElementById("list").innerHTML=items.length?items.map(o=>{
    const title=CAT==="new"?o.n:roomsLabel(o.r,u)+" · "+u.dist[o.d];
    const stText=o.st==="build"?`${u.due}: ${o.due}`:u.st[o.st];
    const msg=encodeURIComponent(`${title} (${o.id}) — ${u.ask}`);
    return `<article class="card prop">
      <div class="img" style="background:linear-gradient(135deg,${o.c[0]},${o.c[1]})" aria-hidden="true">${o.e}<span class="badge">${stText}</span></div>
      <div class="body">
        <h3>${title}</h3>
        <div class="loc">📍 ${u.dist[o.d]}</div>
        <div class="price">${fmtPrice(o.p,u)}</div>
        <div class="meta"><span>${roomsLabel(o.r,u)}</span><span>${o.a} ${u.m2}</span><span>${o.fl} ${u.floor}</span></div>
        <div class="meta">${o.ft.map(f=>`<span>${u.ft[f]}</span>`).join("")}</div>
        <p class="desc">${u.desc[CAT]}</p>
        <div class="acts"><a class="btn primary" href="#/contacts" data-obj="${o.id}">${u.ask}</a><a class="btn ghost" href="https://wa.me/${PHONE}?text=${msg}" target="_blank" rel="noopener">${u.wa}</a></div>
      </div></article>`}).join(""):`<div class="empty" style="grid-column:1/-1">${u.none}</div>`;
  document.querySelectorAll("[data-obj]").forEach(a=>a.onclick=()=>{window.OBJ=a.dataset.obj});
}

function route(){
  const h=location.hash.replace(/^#\/?/,"");
  const cv=document.getElementById("catview");
  const cat=/^(new|resale|rent)$/.test(h)?h:null;
  const pages=[...document.querySelectorAll("main [data-page]")];
  let page=cat?"catalog":(h||"home");
  if(!pages.some(p=>p.id===page))page="home";
  const was=CAT;CAT=cat;
  pages.forEach(p=>p.hidden=cat?true:p.id!==page);
  cv.hidden=!cat;
  if(cat)buildCat();else if(was)setLang(lang);
  document.querySelectorAll("header nav a").forEach(a=>{
    const on=a.getAttribute("href")==="#/"+(cat?"catalog":page);
    if(on)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  });
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
